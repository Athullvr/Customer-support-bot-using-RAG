services:
  typesense:
    image: typesense/typesense:27.1
    container_name: typesense-server
    restart: unless-stopped
    ports:
      - "8108:8108"
    volumes:
      - ./typesense-data:/data
    command:
      - '--data-dir=/data'
      - '--api-key=${TYPESENSE_API_KEY:-xyz}'
      - '--enable-cors'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8108/health"]
      interval: 10s
      timeout: 5s
      retries: 5
